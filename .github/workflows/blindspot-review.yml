name: Blindspot AI Code Reviewer

on:
  push:
    branches:
      - '**'
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Run Blindspot Review (Push)
        if: github.event_name == 'push'
        env:
          ENGINE_PROVIDER: 'bob'
          BOB_API_KEY: ${{ secrets.BOB_API_KEY }}
          BOB_LIVE_API: 'true'
        run: |
          BASE_SHA="${{ github.event.before }}"
          HEAD_SHA="${{ github.sha }}"
          # If this is the very first push (no parent), diff against empty tree
          EMPTY_TREE=$(git hash-object -t tree /dev/null)
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$EMPTY_TREE"
          fi
          git diff "$BASE_SHA" "$HEAD_SHA" > /tmp/blindspot.diff
          # Stage the diff so cli/index.js collectGitDiff picks it up
          git apply --cached /tmp/blindspot.diff || true
          node cli/index.js --provider bob --export-logs

      - name: Run Blindspot Review (Pull Request)
        if: github.event_name == 'pull_request'
        env:
          ENGINE_PROVIDER: 'bob'
          BOB_API_KEY: ${{ secrets.BOB_API_KEY }}
          BOB_LIVE_API: 'true'
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          git reset origin/${{ github.event.pull_request.base.ref }}
          git add -A
          node cli/index.js --provider bob --export-logs

      - name: Commit Report to Branch
        if: github.event_name == 'push'
        run: |
          git config user.name  "blindspot-bot"
          git config user.email "blindspot-bot@users.noreply.github.com"
          git add blindspot-report.md || true
          if git diff --cached --quiet; then
            echo "No changes to report — skipping commit."
          else
            git commit -m "chore: update blindspot-report.md [skip ci]"
            git push
          fi

      - name: Post PR Review Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request' && always()
        with:
          path: blindspot-report.md
          header: blindspot-architectural-review
